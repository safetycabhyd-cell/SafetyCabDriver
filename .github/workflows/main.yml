name: Build SafetyCabDriver APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # Android SDK tools require Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "Java version:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "platforms;android-31" "build-tools;31.0.0"

      # Old SafetyCabDriver Gradle/AGP project
      # Build with Java 11 instead of Java 8
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Check Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCabDriver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
