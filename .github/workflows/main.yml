name: Build SafetyCabDriver APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare clean Android SDK
        run: |
          ORIGINAL_ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cp -R "$ORIGINAL_ANDROID_SDK/cmdline-tools/latest" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;30.0.3"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCabDriver-debug
          path: app/build/outputs/apk/debug/app-debug.apk
